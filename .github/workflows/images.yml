# Baut das gepatchte Chatto-Image und pusht es nach GHCR.
#   ghcr.io/lizzard77/chatto:<CHATTO_VERSION>          (gleitend: neuester Build dieser Version)
#   ghcr.io/lizzard77/chatto:<CHATTO_VERSION>-<sha>    (fest)
name: images

on:
  push:
    branches: [main]
    paths:
      - CHATTO_VERSION
      - patches/**
      - docker/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chatto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          echo "version=$(tr -d '[:space:]' < CHATTO_VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/chatto.Dockerfile
          build-args: CHATTO_VERSION=${{ steps.v.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lizzard77/chatto:${{ steps.v.outputs.version }}
            ghcr.io/lizzard77/chatto:${{ steps.v.outputs.version }}-${{ steps.v.outputs.sha }}
          cache-from: type=gha,scope=chatto
          cache-to: type=gha,mode=max,scope=chatto

